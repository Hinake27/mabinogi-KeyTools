<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>打開模糊不清的盒子</title>
    <style>
        :root {
            color-scheme: dark;
            --window: #252d42;
            --window-deep: #1d2434;
            --line: #4b5261;
            --line-soft: rgba(177, 187, 205, .15);
            --text: #e9eefb;
            --blue: #c8d9ff;
            --green: #22bd36;
            --yellow: #eba820;
            --red: #ff1721;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            display: grid;
            place-items: center;
            padding: 6px;
            overflow: auto;
            color: var(--text);
            font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 48% 15%, rgba(255,255,255,.22), transparent 3%),
                radial-gradient(circle at 10% 10%, #81704f, transparent 35%),
                linear-gradient(135deg, #4e4a3f, #a18e60 47%, #4d594e);
        }

        button { font: inherit; }

        .game-window {
            width: 470px;
            height: 378px;
            border: 1px solid #0a0c11;
            background:
                linear-gradient(90deg, transparent 49.8%, rgba(255,255,255,.02) 50%, transparent 50.2%),
                linear-gradient(180deg, #293249, var(--window));
            box-shadow:
                0 0 0 1px rgba(255,255,255,.13) inset,
                0 7px 18px rgba(0,0,0,.52);
            user-select: none;
        }

        .titlebar {
            height: 58px;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            padding: 10px 9px 0 18px;
            background: linear-gradient(180deg, #283149, #242c40);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 7px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .1px;
            text-shadow: 0 1px 2px #000;
        }

        .lock {
            position: relative;
            width: 14px;
            height: 13px;
            margin-top: 3px;
            border-radius: 1px;
            background: #c8d8fa;
        }

        .lock::before {
            content: "";
            position: absolute;
            left: 3px;
            top: -8px;
            width: 8px;
            height: 9px;
            border: 2px solid #c8d8fa;
            border-bottom: 0;
            border-radius: 7px 7px 0 0;
        }

        .lock::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 4px;
            width: 2px;
            height: 5px;
            background: #5c6f92;
        }

        .top-status {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }

        .status-block {
            min-width: 56px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.1;
        }

        .status-value {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            color: #c4d5fa;
            font-size: 17px;
            line-height: 1;
        }

        .key-icon {
            display: inline-block;
            transform: rotate(-38deg);
            color: #b9cdf4;
            font-size: 17px;
            text-shadow: 0 1px 1px #000;
        }

        .clock-icon {
            position: relative;
            width: 15px;
            height: 15px;
            display: inline-block;
            border-radius: 50%;
            background: #b9cdf4;
        }

        .clock-icon::before,
        .clock-icon::after {
            content: "";
            position: absolute;
            left: 7px;
            top: 3px;
            width: 1px;
            height: 5px;
            background: #39435a;
            transform-origin: bottom;
        }

        .clock-icon::after {
            transform: rotate(90deg);
            height: 4px;
            top: 5px;
        }

        .close {
            width: 23px;
            height: 23px;
            margin-left: 4px;
            padding: 0;
            border: 1px solid #7180a2;
            background: linear-gradient(135deg, #455474, #263047);
            color: #d9e5ff;
            font-size: 0;
            cursor: pointer;
        }

        .help-button {
            width: 23px;
            height: 23px;
            margin-left: 4px;
            padding: 0;
            border: 1px solid #7180a2;
            background: linear-gradient(135deg, #455474, #263047);
            color: #d9e5ff;
            cursor: pointer;
            font: 700 15px/1 "Segoe UI", sans-serif;
        }

        .help-button:hover,
        .help-button:focus-visible {
            outline: none;
            filter: brightness(1.2);
        }

        .close::before,
        .close::after {
            content: "";
            position: absolute;
            width: 17px;
            height: 1px;
            background: #d9e5ff;
        }

        .close { position: relative; }
        .close::before { left: 2px; top: 10px; transform: rotate(45deg); }
        .close::after { left: 2px; top: 10px; transform: rotate(-45deg); }

        .content {
            display: grid;
            grid-template-columns: 220px 1fr;
            height: 319px;
        }

        .left-pane {
            padding: 7px 7px 14px 18px;
            border-right: 1px solid rgba(0,0,0,.35);
        }

        .result-boxes {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 4px;
            height: 61px;
        }

        .result-box {
            display: grid;
            place-items: center;
            border: 1px solid #565d6b;
            background: #111317;
            color: #dce8ff;
            font: 21px/1 "Consolas", "Microsoft JhengHei", monospace;
            text-shadow: 0 0 5px rgba(132,166,229,.55);
        }

        .mobile-input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: .01;
            pointer-events: none;
        }

        .reset {
            border: 1px solid #090b0e;
            box-shadow: 0 0 0 1px #3b4352 inset;
            background:
                linear-gradient(120deg, transparent 0 58%, rgba(255,255,255,.035) 59% 75%, transparent 76%),
                linear-gradient(#222a3a, #171c25);
            color: #d6e3ff;
            cursor: pointer;
            text-shadow: 0 1px 1px #000, 0 0 4px rgba(137,172,238,.4);
        }

        .reset:hover,
        .reset:focus-visible {
            outline: none;
            filter: brightness(1.2);
            box-shadow: 0 0 0 1px #7387aa inset, 0 0 8px rgba(130,164,227,.22);
        }

        .reset:active { transform: translateY(1px); }

        .keyboard-panel {
            width: 188px;
            height: 159px;
            margin-top: 22px;
            padding: 19px 14px;
            border: 1px solid #101319;
            box-shadow: 0 0 0 1px #414a5b inset;
            background:
                linear-gradient(120deg, transparent 0 58%, rgba(255,255,255,.025) 59% 76%, transparent 77%),
                linear-gradient(#20283a, #171c27);
            text-align: center;
        }

        .keyboard-title {
            color: #f2f5ff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px #000;
        }

        .keyboard-keys {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin: 16px 0 13px;
        }

        kbd {
            display: grid;
            width: 29px;
            height: 31px;
            place-items: center;
            border: 1px solid #68738a;
            border-bottom-color: #252b38;
            border-radius: 3px;
            background: linear-gradient(#38445c, #252d3d);
            color: #e5edff;
            font: 18px/1 "Consolas", monospace;
            box-shadow: 0 2px 0 #11151d;
        }

        .keyboard-help {
            color: #aebbd3;
            font-size: 11px;
            line-height: 1.65;
        }

        .reset {
            width: 188px;
            height: 50px;
            margin-top: 3px;
            color: #ffd8d8;
            font: 20px/1 "Consolas", monospace;
            letter-spacing: 1px;
        }

        .reset-symbol {
            display: inline-block;
            margin-right: 8px;
            color: #ffc0c0;
            font: 28px/1 "Segoe UI Symbol", sans-serif;
            vertical-align: -2px;
        }

        .right-pane {
            min-width: 0;
            padding: 6px 18px 12px 10px;
        }

        .history-head,
        .history-row {
            display: grid;
            grid-template-columns: 48px 1fr 37px 37px 37px;
            align-items: center;
        }

        .history-head {
            height: 24px;
            border-top: 1px solid #555c69;
            border-bottom: 1px solid #555c69;
            color: #e5eaf5;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .history-head .number-label { text-align: left; padding-left: 3px; }

        .dot {
            display: inline-block;
            width: 13px;
            height: 13px;
            justify-self: center;
            align-self: center;
            border-radius: 50%;
            background: var(--green);
        }

        .triangle {
            width: 14px;
            height: 13px;
            justify-self: center;
            align-self: center;
            background: var(--yellow);
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }

        .cross {
            justify-self: center;
            align-self: center;
            color: var(--red);
            font: 25px/1 Arial, sans-serif;
        }

        .history-list {
            height: 270px;
            overflow: hidden;
        }

        .history-row {
            height: 27px;
            border-bottom: 1px solid var(--line-soft);
            color: #d9e4fb;
            font: 14px/1 "Consolas", monospace;
        }

        .row-key {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #c2d2f2;
        }

        .row-key .key-icon { font-size: 14px; }
        .guess-number { color: #dce7ff; }
        .mark-count { text-align: center; font-weight: 700; }
        .mark-count.green { color: #54d160; }
        .mark-count.yellow { color: #ffc050; }
        .mark-count.red { color: #ff5961; }

        .message {
            position: absolute;
            left: 50%;
            bottom: 9px;
            z-index: 5;
            min-width: 290px;
            padding: 8px 13px;
            border: 1px solid #9f6267;
            background: rgba(50,25,31,.96);
            color: #ffd7db;
            font-size: 12px;
            text-align: center;
            transform: translateX(-50%);
            box-shadow: 0 4px 12px rgba(0,0,0,.45);
        }

        .message:empty { display: none; }
        .game-window { position: relative; }

        .answer-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 28px;
            background:
                radial-gradient(circle, rgba(83,111,164,.3), transparent 45%),
                rgba(9, 12, 19, .91);
            backdrop-filter: blur(2px);
        }

        .answer-overlay[hidden] { display: none; }

        .tutorial-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: grid;
            place-items: center;
            padding: 22px;
            background: rgba(8, 11, 18, .9);
            backdrop-filter: blur(2px);
        }

        .tutorial-overlay[hidden] { display: none; }

        .tutorial-panel {
            width: 360px;
            max-width: 100%;
            padding: 21px 23px 19px;
            border: 1px solid #8799bd;
            background: linear-gradient(#303b55, #1d2537);
            box-shadow:
                0 0 0 2px #151a24,
                0 0 0 3px #59657d,
                0 14px 35px rgba(0,0,0,.7);
        }

        .tutorial-title {
            margin-bottom: 14px;
            color: #eef3ff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .tutorial-steps {
            margin: 0;
            padding-left: 23px;
            color: #d4def2;
            font-size: 13px;
            line-height: 1.75;
        }

        .tutorial-example {
            margin: 13px 0;
            padding: 9px;
            border: 1px solid #505d76;
            background: #171e2c;
            color: #fff;
            text-align: center;
        }

        .tutorial-example strong {
            color: #ffd65f;
            font: 700 20px "Consolas", monospace;
        }

        .tutorial-close {
            display: block;
            width: 150px;
            height: 40px;
            margin: 15px auto 0;
            border: 1px solid #7585a5;
            background: linear-gradient(#3a4862, #252e40);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .answer-panel {
            width: 330px;
            padding: 26px 24px 23px;
            border: 1px solid #8da0c7;
            background:
                linear-gradient(120deg, transparent 58%, rgba(255,255,255,.035) 59% 76%, transparent 77%),
                linear-gradient(#303b55, #1d2537);
            text-align: center;
            box-shadow:
                0 0 0 2px #151a24,
                0 0 0 3px #59657d,
                0 14px 35px rgba(0,0,0,.7),
                0 0 28px rgba(137,170,237,.25);
        }

        .answer-title {
            color: #dbe7ff;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px #000;
        }

        .answer-number {
            margin: 16px 0 19px;
            color: #fff;
            font: 700 78px/.95 "Consolas", monospace;
            letter-spacing: 15px;
            text-indent: 15px;
            text-shadow:
                0 0 5px #7fa9ff,
                0 0 16px rgba(92,142,242,.75),
                0 3px 2px #000;
        }

        .answer-hint {
            margin-bottom: 17px;
            color: #aebbd4;
            font-size: 12px;
        }

        .answer-reset {
            width: 190px;
            height: 45px;
            border: 1px solid #11151d;
            box-shadow: 0 0 0 1px #65728c inset;
            background: linear-gradient(#354158, #202838);
            color: #ffdada;
            cursor: pointer;
            font: 18px/1 "Consolas", monospace;
            letter-spacing: 1px;
        }

        .answer-reset:hover,
        .answer-reset:focus-visible {
            outline: none;
            filter: brightness(1.18);
        }

        .closed {
            display: none;
        }

        @media (max-width: 490px) {
            body {
                display: block;
                padding: 0;
                min-height: 100dvh;
                background: #20283a;
            }

            .game-window {
                width: 100vw;
                height: auto;
                min-height: 100dvh;
                border: 0;
                box-shadow: none;
            }

            .titlebar {
                position: sticky;
                top: 0;
                z-index: 10;
                height: 72px;
                padding: 9px 8px 0 13px;
            }

            .title {
                gap: 8px;
                font-size: 15px;
                white-space: nowrap;
            }

            .top-status { gap: 8px; }
            .status-block { min-width: 46px; font-size: 9px; }
            .status-value { gap: 4px; font-size: 16px; }
            .close { display: none; }
            .help-button { margin-left: 0; }

            .content {
                display: block;
                height: auto;
            }

            .left-pane {
                display: grid;
                grid-template-columns: 1fr;
                justify-items: center;
                padding: 18px 16px 16px;
                border-right: 0;
                border-bottom: 1px solid #111722;
            }

            .result-boxes {
                position: relative;
                width: min(330px, 92vw);
                height: 88px;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .result-box {
                font-size: 36px;
                border-color: #68738a;
            }

            .result-boxes::after {
                content: "點此輸入";
                position: absolute;
                right: 8px;
                bottom: -18px;
                color: #8fa4cc;
                font-size: 10px;
            }

            .mobile-input {
                inset: 0;
                width: 100%;
                height: 100%;
                opacity: .01;
                pointer-events: auto;
                font-size: 16px;
            }

            .keyboard-panel {
                width: min(330px, 92vw);
                height: 100px;
                margin-top: 32px;
                padding: 12px;
            }

            .keyboard-title { font-size: 15px; }
            .keyboard-keys { display: none; }
            .keyboard-help {
                margin-top: 9px;
                font-size: 12px;
            }

            .reset {
                width: min(330px, 92vw);
                height: 54px;
                margin-top: 8px;
                font-size: 19px;
            }

            .right-pane {
                padding: 14px 12px 24px;
            }

            .history-head,
            .history-row {
                grid-template-columns: 52px 1fr 43px 43px 43px;
            }

            .history-head { height: 32px; font-size: 13px; }
            .history-list { height: auto; min-height: 270px; }
            .history-row { height: 34px; font-size: 15px; }

            .answer-overlay {
                position: fixed;
                padding: 18px;
            }

            .tutorial-overlay {
                position: fixed;
                padding: 16px;
            }

            .tutorial-panel { width: min(370px, 94vw); }
            .tutorial-steps { font-size: 14px; }

            .answer-panel { width: min(350px, 92vw); }
            .answer-number { font-size: 68px; }
            .message {
                position: fixed;
                bottom: 14px;
                min-width: 0;
                width: calc(100vw - 28px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
<section class="game-window" id="gameWindow" aria-label="模糊不清的盒子解碼器">
    <header class="titlebar">
        <div class="title"><span class="lock" aria-hidden="true"></span>打開模糊不清的盒子</div>
        <div class="top-status">
            <div class="status-block">
                <div>剩餘機會</div>
                <div class="status-value"><span class="key-icon">⚿</span><span id="chances">10</span></div>
            </div>
            <div class="status-block">
                <div>剩餘可能</div>
                <div class="status-value"><span class="clock-icon"></span><span id="possibleCount">504</span></div>
            </div>
            <button class="help-button" id="helpButton" type="button" aria-label="開啟教學">?</button>
            <button class="close" id="closeButton" type="button" aria-label="關閉"></button>
        </div>
    </header>

    <div class="content">
        <section class="left-pane" aria-label="輸入區">
            <div class="result-boxes" aria-label="輸入遊戲結果">
                <div class="result-box" data-result-box></div>
                <div class="result-box" data-result-box></div>
                <div class="result-box" data-result-box></div>
                <input
                    class="mobile-input"
                    id="mobileInput"
                    type="text"
                    inputmode="numeric"
                    pattern="[0-3]*"
                    maxlength="3"
                    autocomplete="off"
                    aria-label="輸入三位遊戲結果"
                >
            </div>
            <div class="keyboard-panel" aria-label="鍵盤輸入說明">
                <div class="keyboard-title">直接使用鍵盤輸入</div>
                <div class="keyboard-keys">
                    <kbd>0</kbd><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>
                </div>
                <div class="keyboard-help">
                    輸滿三位會自動確認<br>
                    Backspace 刪除・Esc 重設
                </div>
            </div>

            <button class="reset" id="resetButton" type="button">
                <span class="reset-symbol">↻</span>RESET
            </button>
        </section>

        <section class="right-pane" aria-label="猜測紀錄">
            <div class="history-head">
                <span>機會</span>
                <span class="number-label">號碼</span>
                <span class="dot" title="綠色"></span>
                <span class="triangle" title="黃色"></span>
                <span class="cross" title="紅色">×</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </section>
    </div>

    <div class="message" id="message" role="alert"></div>

    <div class="answer-overlay" id="answerOverlay" hidden>
        <div class="answer-panel" role="dialog" aria-modal="true" aria-labelledby="answerTitle">
            <div class="answer-title" id="answerTitle">答案已確定</div>
            <div class="answer-number" id="answerNumber">---</div>
            <div class="answer-hint">請在遊戲中輸入這組號碼</div>
            <button class="answer-reset" id="answerResetButton" type="button">
                <span class="reset-symbol">↻</span>重新開始
            </button>
        </div>
    </div>

    <div class="tutorial-overlay" id="tutorialOverlay" hidden>
        <div class="tutorial-panel" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
            <div class="tutorial-title" id="tutorialTitle">遊戲解碼教學</div>
            <ol class="tutorial-steps">
                <li>將右側目前顯示的「號碼」輸入遊戲。</li>
                <li>查看遊戲回傳的綠色、黃色、紅色數量。</li>
                <li>依序用鍵盤輸入三位數：綠、黃、紅。</li>
                <li>輸滿三位後，工具會自動顯示下一組號碼。</li>
                <li>答案確定時，畫面會放大顯示正確密碼。</li>
            </ol>
            <div class="tutorial-example">
                例如 <strong>120</strong>＝1 綠、2 黃、0 紅
            </div>
            <button class="tutorial-close" id="tutorialCloseButton" type="button">知道了</button>
        </div>
    </div>
</section>

<script>
    "use strict";

    const MAX_ATTEMPTS = 10;
    const hints = [];
    const allCandidates = [];
    let inputResult = "";
    let openingSuggestion = "";

    for (let a = 1; a <= 9; a++) {
        for (let b = 1; b <= 9; b++) {
            for (let c = 1; c <= 9; c++) {
                if (a !== b && a !== c && b !== c) allCandidates.push(`${a}${b}${c}`);
            }
        }
    }

    const els = {
        window: document.querySelector("#gameWindow"),
        resultBoxes: [...document.querySelectorAll("[data-result-box]")],
        mobileInput: document.querySelector("#mobileInput"),
        reset: document.querySelector("#resetButton"),
        help: document.querySelector("#helpButton"),
        close: document.querySelector("#closeButton"),
        chances: document.querySelector("#chances"),
        possibleCount: document.querySelector("#possibleCount"),
        history: document.querySelector("#historyList"),
        message: document.querySelector("#message"),
        answerOverlay: document.querySelector("#answerOverlay"),
        answerNumber: document.querySelector("#answerNumber"),
        answerReset: document.querySelector("#answerResetButton"),
        tutorialOverlay: document.querySelector("#tutorialOverlay"),
        tutorialClose: document.querySelector("#tutorialCloseButton")
    };

    function score(secret, guess) {
        let green = 0;
        let yellow = 0;
        for (let i = 0; i < 3; i++) {
            if (secret[i] === guess[i]) green++;
            else if (secret.includes(guess[i])) yellow++;
        }
        return { green, yellow, red: 3 - green - yellow };
    }

    function getPossible() {
        return allCandidates.filter(secret => hints.every(hint => {
            const result = score(secret, hint.guess);
            return result.green === hint.green &&
                result.yellow === hint.yellow &&
                result.red === hint.red;
        }));
    }

    function getSuggestion(possible) {
        if (!possible.length) return "—";
        if (possible.length === 1) return possible[0];
        if (!hints.length) return openingSuggestion;

        const possibleSet = new Set(possible);
        let bestGuess = allCandidates[0];
        let bestExpected = Infinity;
        let bestWorst = Infinity;
        let bestIsPossible = false;

        for (const guess of allCandidates) {
            const groups = new Map();
            for (const secret of possible) {
                const result = score(secret, guess);
                const key = `${result.green}${result.yellow}${result.red}`;
                groups.set(key, (groups.get(key) || 0) + 1);
            }

            const sizes = [...groups.values()];
            const expected = sizes.reduce((sum, size) => sum + size * size, 0);
            const worst = Math.max(...sizes);
            const isPossible = possibleSet.has(guess);

            if (
                expected < bestExpected ||
                (expected === bestExpected && worst < bestWorst) ||
                (expected === bestExpected && worst === bestWorst && isPossible && !bestIsPossible)
            ) {
                bestGuess = guess;
                bestExpected = expected;
                bestWorst = worst;
                bestIsPossible = isPossible;
            }
        }
        return bestGuess;
    }

    function randomCandidate() {
        return allCandidates[Math.floor(Math.random() * allCandidates.length)];
    }

    function setMessage(text) {
        els.message.textContent = text;
        if (text) window.setTimeout(() => {
            if (els.message.textContent === text) els.message.textContent = "";
        }, 2600);
    }

    function renderInput() {
        els.resultBoxes.forEach((box, index) => {
            box.textContent = inputResult[index] || "";
        });
    }

    function render() {
        const possible = getPossible();
        const suggestion = getSuggestion(possible);

        els.chances.textContent = Math.max(0, MAX_ATTEMPTS - hints.length);
        els.possibleCount.textContent = possible.length;
        els.history.innerHTML = "";

        for (let index = 0; index < MAX_ATTEMPTS; index++) {
            const hint = hints[index];
            const row = document.createElement("div");
            row.className = "history-row";
            row.innerHTML = `
                <span class="row-key"><span class="key-icon">⚿</span>${index + 1}</span>
                <span class="guess-number">${hint ? hint.guess : (index === hints.length ? suggestion : "")}</span>
                <span class="mark-count green">${hint ? hint.green : ""}</span>
                <span class="mark-count yellow">${hint ? hint.yellow : ""}</span>
                <span class="mark-count red">${hint ? hint.red : ""}</span>
            `;
            els.history.appendChild(row);
        }

        if (!possible.length) {
            setMessage("沒有符合的答案，請按 RESET 後重新確認結果。");
        } else if (possible.length === 1 && hints.length) {
            els.answerNumber.textContent = possible[0];
            els.answerOverlay.hidden = false;
            els.answerReset.focus();
        }
    }

    function submitResult() {
        if (inputResult.length !== 3) return;
        const values = [...inputResult].map(Number);
        const total = values.reduce((sum, value) => sum + value, 0);

        if (values.some(value => value > 3) || total !== 3) {
            setMessage("結果格式錯誤：三位數依序為綠、黃、紅，總和必須是 3。");
            inputResult = "";
            els.mobileInput.value = "";
            renderInput();
            return;
        }

        const possible = getPossible();
        if (!possible.length || possible.length === 1 || hints.length >= MAX_ATTEMPTS) return;

        const guess = getSuggestion(possible);
        hints.push({
            guess,
            green: values[0],
            yellow: values[1],
            red: values[2]
        });
        inputResult = "";
        els.mobileInput.value = "";
        renderInput();
        render();
    }

    function resetGame() {
        hints.length = 0;
        inputResult = "";
        els.mobileInput.value = "";
        openingSuggestion = randomCandidate();
        els.message.textContent = "";
        els.answerOverlay.hidden = true;
        renderInput();
        render();
    }

    function enterPhysicalKey(key) {
        els.message.textContent = "";
        if (!/^[0-9]$/.test(key)) return;
        if (Number(key) > 3) {
            setMessage("遊戲結果只能輸入 0、1、2、3。");
            return;
        }
        if (inputResult.length >= 3) inputResult = "";
        inputResult += key;
        renderInput();
        if (inputResult.length === 3) submitResult();
    }

    els.reset.addEventListener("click", resetGame);
    els.answerReset.addEventListener("click", resetGame);
    els.help.addEventListener("click", () => {
        els.tutorialOverlay.hidden = false;
        els.tutorialClose.focus();
    });
    els.tutorialClose.addEventListener("click", () => {
        els.tutorialOverlay.hidden = true;
    });
    els.tutorialOverlay.addEventListener("click", event => {
        if (event.target === els.tutorialOverlay) els.tutorialOverlay.hidden = true;
    });
    els.close.addEventListener("click", () => {
        els.window.classList.add("closed");
        window.setTimeout(() => els.window.classList.remove("closed"), 500);
    });

    els.mobileInput.addEventListener("input", () => {
        const raw = els.mobileInput.value.replace(/\D/g, "").slice(0, 3);
        if ([...raw].some(value => Number(value) > 3)) {
            setMessage("遊戲結果只能輸入 0、1、2、3。");
            els.mobileInput.value = "";
            inputResult = "";
            renderInput();
            return;
        }
        els.mobileInput.value = raw;
        inputResult = raw;
        renderInput();
        if (inputResult.length === 3) submitResult();
    });

    document.addEventListener("keydown", event => {
        if (document.activeElement === els.mobileInput) return;
        if (!els.tutorialOverlay.hidden) {
            if (event.key === "Escape" || event.key === "Enter") {
                event.preventDefault();
                els.tutorialOverlay.hidden = true;
            }
            return;
        }
        if (!els.answerOverlay.hidden) {
            if (event.key === "Enter" || event.key === "Escape") {
                event.preventDefault();
                resetGame();
            }
            return;
        }

        if (/^[0-9]$/.test(event.key)) {
            event.preventDefault();
            enterPhysicalKey(event.key);
            return;
        }
        if (event.key === "Backspace") {
            event.preventDefault();
            inputResult = inputResult.slice(0, -1);
            renderInput();
            return;
        }
        if (event.key === "Escape") {
            event.preventDefault();
            resetGame();
        }
    });

    resetGame();
</script>
</body>
</html>
